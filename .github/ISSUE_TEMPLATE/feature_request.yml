name: Feature request
description: Suggest an improvement to the CLI, MCP server, skill, or docs
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Submitting creates a public GitHub issue under your username, so leave out anything private.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation a contributor is in and what is hard about it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: A command, an MCP tool, skill guidance, or a doc change. Rough ideas are fine.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Fit with the project
      options:
        - label: This helps people contribute well, not just more. It does not encourage mass or low-effort contributions.
          required: true
