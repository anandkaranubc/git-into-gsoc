name: Chore / maintenance
description: Tooling, CI, deps, or repo hygiene (not a user-facing bug/feature)
labels: ["chore"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What needs maintenance and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is done?
    validations:
      required: true
