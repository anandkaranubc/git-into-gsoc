name: Live journeys

# Runs beginner journeys against live GitHub, GitLab, and GSoC data on Linux, macOS,
# and Windows (scripts/live_journeys.py). Unit tests block the network, so this is
# where a real Windows console and real pages are exercised. A crash fails the job;
# an answer that changed because live data moved is reported as drift only.
# Not a required check: live data can be slow or change under it.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "release: the newest published release. main: this commit."
        type: choice
        options: [release, main]
        default: release
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - "scripts/live_journeys.py"
      - ".github/workflows/live.yml"

permissions:
  contents: read

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    name: Live journeys (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the newest release
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.source == 'release')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "${{ github.repository }}" --pattern '*.whl' --dir dist
          python -m pip install --quiet dist/*.whl
      - name: Install this commit
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.source == 'main')
        shell: bash
        run: python -m pip install --quiet .
      - name: Run the journeys
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m git_into_gsoc --version
          python scripts/live_journeys.py --summary "$GITHUB_STEP_SUMMARY"
