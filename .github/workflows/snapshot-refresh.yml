name: Refresh organization snapshot

# The package embeds a compact copy of the official organization list and every
# organization's history so `orgs` works offline. Keep it fresh without a human
# remembering to run the refresher before each release.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh snapshot
    runs-on: ubuntu-latest
    steps:
      # Keeps the checkout's credentials: the last step pushes a branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Refresh from live sources
        run: python -m git_into_gsoc.gsoc.snapshot

      # Ideas pages and repository languages, used to explain and rank matches.
      # Monthly (the first Monday, or when run by hand), so the data pull request
      # does not open every week. The token only lists public repositories; ideas
      # pages are fetched without it. Failed pages keep last month's evidence.
      - name: Refresh ideas-page and repository evidence
        # A failure here keeps last month's evidence; the snapshot still goes out.
        continue-on-error: true
        env:
          # The built-in token's searches with an OR group come back wrong, so the
          # canary keeps last month's beginner counts and statements. A read-only
          # token of the owner's, when set, reads them like a person's searches do.
          GITHUB_TOKEN: ${{ secrets.SNAPSHOT_READ_TOKEN || github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$(date -u +%d)" -le 7 ]; then
            python -m git_into_gsoc.matching.signals
          else
            echo "evidence refresh runs on the first Monday of the month"
          fi

      - name: Open a pull request when the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/git_into_gsoc/data; then
            echo "snapshot unchanged"
            exit 0
          fi
          branch="chore/snapshot-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/git_into_gsoc/data
          git commit -m "chore(data): refresh the organization snapshot and evidence"
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(data): refresh the organization snapshot and evidence" \
            --body "Weekly refresh of the embedded organization list and history from the official site and the community archive, and (on the first Monday of each month) the ideas-page and repository evidence used to rank matches. Close and reopen this pull request to run CI (bot-created pull requests do not trigger workflows); CI also runs the ranking benchmark (tests/unit/test_match_benchmark.py), so a red benchmark means the new data made recommendations worse. Then squash-merge." \
            || echo "pull request already open"
