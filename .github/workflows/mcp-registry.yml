name: Release assets and MCP registry

# Builds the release assets from the tagged source and attaches them to the
# GitHub release: the Python wheel and source archive (installable by URL until
# the package is on PyPI) and the MCPB bundle. Then publishes this server to the
# public MCP registry (registry.modelcontextprotocol.io). Authentication uses
# GitHub's OIDC token, so no secret is stored; the namespace
# io.github.anandkaranubc/* is granted to this repository's owner.
#
# The release workflow dispatches this one after Release Please creates a
# release, because a release created with the built-in Actions token does not
# fire the `release` event. Running it again for a tag refreshes the wheel and
# the source archive. The registry records the bundle's checksum when a version
# is published and cannot be edited by this workflow, so an already published
# bundle is never replaced: the run only checks that it still matches.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.2.0"
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build assets and publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The workflow's own ref supplies server.json and the build script; the
      # assets are built from the tagged source so their contents match the
      # release exactly.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out the tagged source
        run: git worktree add /tmp/tagged-source "${{ steps.tag.outputs.tag }}"

      - name: Build the wheel and source archive from the tag
        run: |
          python -m pip install -U pip build
          python -m build --outdir dist /tmp/tagged-source

      - name: Build the MCPB bundle from the tag
        run: python scripts/build_mcpb.py --root /tmp/tagged-source --out dist/git-into-gsoc.mcpb

      - name: Check that the built version matches the tag
        run: |
          ls -l dist
          test -f "dist/git_into_gsoc-${{ steps.tag.outputs.version }}-py3-none-any.whl"
          test -f "dist/git_into_gsoc-${{ steps.tag.outputs.version }}.tar.gz"

      - name: Look the version up in the registry
        id: registry
        run: |
          NAME="$(jq -r .name server.json)"
          VERSION="${{ steps.tag.outputs.version }}"
          RECORD="$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers/${NAME//\//%2F}/versions/${VERSION}" || true)"
          RECORDED_SHA="$(jq -r '.server.packages[0].fileSha256 // empty' <<<"$RECORD" 2>/dev/null || true)"
          if [ -n "$RECORDED_SHA" ]; then
            echo "Version $VERSION is already in the registry with bundle checksum $RECORDED_SHA."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "recorded_sha=${RECORDED_SHA}" >> "$GITHUB_OUTPUT"

      - name: Attach the wheel and source archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" dist/*.whl dist/*.tar.gz --clobber

      - name: Attach the bundle to the release
        if: steps.registry.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" dist/git-into-gsoc.mcpb --clobber

      - name: Check that the published bundle still matches the registry
        if: steps.registry.outputs.publish == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          RECORDED="${{ steps.registry.outputs.recorded_sha }}"
          BUILT="$(openssl dgst -sha256 dist/git-into-gsoc.mcpb | awk '{print $NF}')"
          mkdir -p published
          if gh release download "$TAG" --pattern git-into-gsoc.mcpb --dir published --clobber; then
            ON_RELEASE="$(openssl dgst -sha256 published/git-into-gsoc.mcpb | awk '{print $NF}')"
          else
            ON_RELEASE="missing"
          fi
          if [ "$ON_RELEASE" = "$RECORDED" ]; then
            echo "The bundle on the release matches the registry; left untouched."
          elif [ "$BUILT" = "$RECORDED" ]; then
            echo "The bundle on the release was $ON_RELEASE; restoring the matching build."
            gh release upload "$TAG" dist/git-into-gsoc.mcpb --clobber
          else
            echo "::error::The registry recorded bundle checksum $RECORDED for $TAG, the release has $ON_RELEASE, and this build gives $BUILT. The registry entry cannot be edited, so restore the original bundle by hand (see docs/releasing.md)."
            exit 1
          fi

      - name: Point server.json at the release asset
        if: steps.registry.outputs.publish == 'true'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          SHA=$(openssl dgst -sha256 dist/git-into-gsoc.mcpb | awk '{print $NF}')
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/git-into-gsoc.mcpb"
          jq --arg v "$VERSION" --arg url "$URL" --arg sha "$SHA" \
            '.version = $v | .packages = [{"registryType": "mcpb", "identifier": $url, "fileSha256": $sha, "transport": {"type": "stdio"}}]' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        if: steps.registry.outputs.publish == 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP registry with GitHub OIDC
        if: steps.registry.outputs.publish == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish
        if: steps.registry.outputs.publish == 'true'
        run: ./mcp-publisher publish
