name: Release assets and MCP registry

# Builds the release assets from the tagged source and attaches them to the
# GitHub release: the Python wheel and source archive (installable by URL
# without PyPI) and the MCPB bundle. Then publishes this server to the public
# MCP registry (registry.modelcontextprotocol.io) with the bundle and the PyPI
# package that release.yml uploads. Authentication uses
# GitHub's OIDC token, so no secret is stored; the namespace
# io.github.anandkaranubc/* is granted to this repository's owner.
#
# The release workflow dispatches this one after Release Please creates a
# release. It has no `release` trigger: a release created with the built-in
# token fires no event, and one created with RELEASE_PLEASE_TOKEN would start
# this workflow a second time. Running it again for a tag refreshes the wheel and
# the source archive. The registry records the bundle's checksum when a version
# is published and cannot be edited by this workflow, so an already published
# bundle is never replaced: the run only checks that it still matches.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.2.0"
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build assets and publish
    runs-on: ubuntu-latest
    steps:
      # The tag reaches the shell as data, never as script text, and must look
      # like vX.Y.Z before any later step uses it.
      - name: Resolve tag
        env:
          INPUT_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '::error::%q is not a release tag such as v0.2.0.\n' "$INPUT_TAG"
            exit 1
          fi
          echo "TAG=${INPUT_TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${INPUT_TAG#v}" >> "$GITHUB_ENV"

      # The workflow's own ref supplies server.json and the build script; the
      # assets are built from the tagged source so their contents match the
      # release exactly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check out the tagged source
        run: git worktree add /tmp/tagged-source "$TAG"

      - name: Build the wheel and source archive from the tag
        run: |
          python -m pip install -U pip build
          python -m build --outdir dist /tmp/tagged-source

      - name: Build the MCPB bundle from the tag
        run: python scripts/build_mcpb.py --root /tmp/tagged-source --out dist/git-into-gsoc.mcpb

      - name: Check that the built version matches the tag
        run: |
          ls -l dist
          test -f "dist/git_into_gsoc-${VERSION}-py3-none-any.whl"
          test -f "dist/git_into_gsoc-${VERSION}.tar.gz"

      - name: Look the version up in the registry
        id: registry
        run: |
          NAME="$(jq -r .name server.json)"
          RECORD="$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers/${NAME//\//%2F}/versions/${VERSION}" || true)"
          RECORDED_SHA="$(jq -r '.server.packages[0].fileSha256 // empty' <<<"$RECORD" 2>/dev/null || true)"
          if [ -n "$RECORDED_SHA" ]; then
            echo "Version $VERSION is already in the registry with bundle checksum $RECORDED_SHA."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "recorded_sha=${RECORDED_SHA}" >> "$GITHUB_OUTPUT"

      - name: Attach the wheel and source archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.whl dist/*.tar.gz --clobber

      - name: Attach the bundle to the release
        if: steps.registry.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/git-into-gsoc.mcpb --clobber

      - name: Check that the published bundle still matches the registry
        if: steps.registry.outputs.publish == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RECORDED: ${{ steps.registry.outputs.recorded_sha }}
        run: |
          BUILT="$(openssl dgst -sha256 dist/git-into-gsoc.mcpb | awk '{print $NF}')"
          mkdir -p published
          if gh release download "$TAG" --pattern git-into-gsoc.mcpb --dir published --clobber; then
            ON_RELEASE="$(openssl dgst -sha256 published/git-into-gsoc.mcpb | awk '{print $NF}')"
          else
            ON_RELEASE="missing"
          fi
          if [ "$ON_RELEASE" = "$RECORDED" ]; then
            echo "The bundle on the release matches the registry; left untouched."
          elif [ "$BUILT" = "$RECORDED" ]; then
            echo "The bundle on the release was $ON_RELEASE; restoring the matching build."
            gh release upload "$TAG" dist/git-into-gsoc.mcpb --clobber
          else
            echo "::error::The registry recorded bundle checksum $RECORDED for $TAG, the release has $ON_RELEASE, and this build gives $BUILT. The registry entry cannot be edited, so restore the original bundle by hand (see docs/releasing.md)."
            exit 1
          fi

      # The registry accepts a PyPI package only once PyPI serves that version and
      # its description carries the README's mcp-name line. release.yml uploads to
      # PyPI while this workflow runs, so wait for it. If it never appears, list
      # the bundle alone rather than fail the whole entry.
      - name: Wait for the version on PyPI
        id: pypi
        if: steps.registry.outputs.publish == 'true'
        run: |
          TOKEN="mcp-name: $(jq -r .name server.json)"
          for _ in $(seq 20); do
            if curl -fsS -o pypi.json "https://pypi.org/pypi/git-into-gsoc/${VERSION}/json" \
              && jq -e --arg token "$TOKEN" '.info.description | contains($token)' pypi.json >/dev/null; then
              echo "PyPI serves git-into-gsoc ${VERSION}."
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::PyPI did not serve git-into-gsoc ${VERSION} with the mcp-name line within 10 minutes, so the registry entry lists only the bundle. Check the Publish to PyPI job of the release run."
          echo "available=false" >> "$GITHUB_OUTPUT"

      # The bundle stays first: the registry lookup above reads packages[0].
      - name: Point server.json at the release asset and the PyPI package
        if: steps.registry.outputs.publish == 'true'
        env:
          PYPI_AVAILABLE: ${{ steps.pypi.outputs.available }}
        run: |
          SHA=$(openssl dgst -sha256 dist/git-into-gsoc.mcpb | awk '{print $NF}')
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/git-into-gsoc.mcpb"
          jq --arg v "$VERSION" --arg url "$URL" --arg sha "$SHA" --arg pypi "$PYPI_AVAILABLE" \
            '.version = $v
             | .packages = [{"registryType": "mcpb", "identifier": $url, "fileSha256": $sha, "transport": {"type": "stdio"}}]
               + (if $pypi == "true" then [{"registryType": "pypi", "identifier": "git-into-gsoc", "version": $v, "runtimeHint": "uvx", "transport": {"type": "stdio"}, "packageArguments": [{"type": "positional", "value": "mcp"}]}] else [] end)' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json

      # A fixed release, checked against its published checksum, because this
      # job can publish to the registry and change the release. To update it,
      # take the version and the linux_amd64 line from that release's
      # registry_<version>_checksums.txt.
      - name: Install mcp-publisher
        if: steps.registry.outputs.publish == 'true'
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      # The registry checks PyPI itself, and its view can lag behind the one the wait
      # step saw: 0.16.0 was first refused with "version '0.16.0' was not found". So
      # retry that refusal for up to 10 minutes, logging in again each time in case the
      # registry token expires. Then publish the bundle alone rather than nothing. Any
      # other error fails the run at once.
      - name: Publish
        if: steps.registry.outputs.publish == 'true'
        run: |
          for attempt in $(seq 10); do
            ./mcp-publisher login github-oidc
            if ./mcp-publisher publish > publish.log 2>&1; then
              cat publish.log
              exit 0
            fi
            cat publish.log
            if ! grep -Eq "version '[^']*' (was )?not found|PyPI could not confirm" publish.log; then
              exit 1
            fi
            echo "The registry does not see git-into-gsoc ${VERSION} on PyPI yet (attempt ${attempt} of 10). Trying again in a minute."
            sleep 60
          done
          echo "::warning::The registry still could not see git-into-gsoc ${VERSION} on PyPI after 10 minutes, so this version lists only the bundle. Registry versions cannot be changed, so the PyPI package returns with the next release."
          jq '.packages |= map(select(.registryType != "pypi"))' server.json > server.tmp && mv server.tmp server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
