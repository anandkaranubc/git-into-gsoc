name: Agents

# Installs git-into-gsoc into real AI coding agents (Claude Code, Codex, Gemini CLI,
# Copilot CLI, Antigravity, Cursor's agent CLI, and VS Code), each in a throwaway home
# folder, and checks that every one of them can start the server: the plugin or
# extension route, the one-click button configs, the Claude Desktop bundle, and
# `git-into-gsoc setup`.
# No secrets, no logins, and no model calls. See scripts/check_agents.py.
#
# Pull requests use the agent versions pinned below. The weekly run uses the newest
# release of each agent, because they change their plugin formats often, and also
# installs from GitHub the way people do.

on:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".github/plugin/**"
      - "gemini-extension.json"
      - "skills/**"
      - "pyproject.toml"
      - "src/git_into_gsoc/config.py"
      - "src/git_into_gsoc/install/**"
      - "src/git_into_gsoc/mcp_server.py"
      - "scripts/build_mcpb.py"
      - "scripts/check_agents.py"
      - "scripts/mcp_smoke.py"
      - ".github/workflows/agents.yml"
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".github/plugin/**"
      - "gemini-extension.json"
      - "skills/**"
      - "pyproject.toml"
      - "src/git_into_gsoc/config.py"
      - "src/git_into_gsoc/install/**"
      - "src/git_into_gsoc/mcp_server.py"
      - "scripts/build_mcpb.py"
      - "scripts/check_agents.py"
      - "scripts/mcp_smoke.py"
      - ".github/workflows/agents.yml"
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents:
    name: Agent CLIs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE: "2.1.306"
      CODEX: "0.163.0"
      GEMINI_CLI: "0.65.0"
      COPILOT_CLI: "1.0.101"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install uv and the package
        run: |
          python -m pip install uv
          python -m uv pip install --system -e .

      - name: Install the agent CLIs
        env:
          NEWEST: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$NEWEST" = "true" ]; then
            CLAUDE_CODE=latest CODEX=latest GEMINI_CLI=latest COPILOT_CLI=latest
          fi
          npm install --global --no-fund --no-audit \
            "@anthropic-ai/claude-code@${CLAUDE_CODE}" \
            "@openai/codex@${CODEX}" \
            "@google/gemini-cli@${GEMINI_CLI}" \
            "@github/copilot@${COPILOT_CLI}"
          claude --version
          codex --version
          gemini --version
          copilot --version

      # These come from each vendor's own installer, which has no version to pin. A
      # failed download skips that agent instead of failing the job.
      - name: Install the Antigravity and Cursor agent CLIs
        continue-on-error: true
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          curl -fsS https://cursor.com/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install VS Code
        continue-on-error: true
        run: |
          curl -fsSL -o "$RUNNER_TEMP/code.deb" "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64"
          sudo apt-get install -y -q "$RUNNER_TEMP/code.deb"

      - name: Every route, from this checkout
        run: python scripts/check_agents.py --setup --require claude,codex,gemini,copilot,claude-desktop

      - name: Every route, from GitHub
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/check_agents.py --remote --require claude,codex,gemini,copilot,claude-desktop
