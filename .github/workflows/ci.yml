name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tools
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src

      - name: Dependency audit
        run: pip-audit

      - name: Skill structure
        run: |
          python -c "from pathlib import Path; t=Path('skills/git-into-gsoc/SKILL.md').read_text(); assert t.startswith('---'); assert 'name: git-into-gsoc' in t"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        # Full matrix kept lean: oldest supported + current stable.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Pytest
        run: pytest --cov=git_into_gsoc --cov-report=term-missing --cov-fail-under=50

  smoke:
    name: Installer smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: One-shot installer
        run: |
          chmod +x install.sh
          ./install.sh --no-user-skills
          .venv/bin/git-into-gsoc --version
          .venv/bin/git-into-gsoc journey --output json | grep -q learn
