name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # uv installs the same packages as pip in a few seconds instead of most of
      # the job. The installer smoke jobs below still test the real install paths.
      - name: Install package and tools
        run: |
          python -m pip install uv
          python -m uv pip install --system -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format
        run: ruff format --check src tests scripts

      - name: Mypy
        run: mypy src

      - name: Dependency audit
        run: pip-audit

      # The other hooks in .pre-commit-config.yaml (end of file, whitespace,
      # merge markers, private keys, large files). Ruff and mypy ran above.
      # This also tests Dependabot's updates to those hooks.
      - name: Pre-commit hooks
        env:
          SKIP: ruff,ruff-format,mypy
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    # Job names are required status checks in the main branch ruleset; keep
    # them stable when editing (tests/unit/test_workflows.py lists them).
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux except 3.12, which macOS and Windows
        # cover because install paths and config files differ there.
        include:
          - { os: ubuntu-latest, python-version: "3.11", label: "Python 3.11" }
          - { os: ubuntu-latest, python-version: "3.13", label: "Python 3.13" }
          - { os: ubuntu-latest, python-version: "3.14", label: "Python 3.14" }
          - { os: macos-latest, python-version: "3.12", label: "macOS, Python 3.12" }
          - { os: windows-latest, python-version: "3.12", label: "Windows, Python 3.12" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install uv
          python -m uv pip install --system -e ".[dev]"

      # Coverage is about 89% on every system; the floor catches a real drop.
      - name: Pytest
        run: pytest --cov=git_into_gsoc --cov-report=term-missing --cov-fail-under=85

  smoke:
    name: Installer smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: One-shot installer (clone, project scope)
        run: |
          chmod +x install.sh
          ./install.sh --no-user-skills --assistant all
          .venv/bin/git-into-gsoc --version
          .venv/bin/git-into-gsoc journey --output json | grep -q learn
          test -f .claude/skills/git-into-gsoc/SKILL.md
          test -f .cursor/mcp.json
          .venv/bin/git-into-gsoc setup --dry-run --scope project --assistant all --output json | grep -q '"unchanged"'

      - name: Wheel ships the skill (uv tool install, no clone)
        run: |
          pip install -q uv
          uv tool install --force .
          GIG_HOME="$RUNNER_TEMP/home" "$(uv tool dir --bin)/git-into-gsoc" setup --assistant gemini --output json | grep -q '"created"'
          test -f "$RUNNER_TEMP/home/.agents/skills/git-into-gsoc/SKILL.md"

      - name: One-line installer (curl path, no clone)
        run: |
          # Run install.sh from outside the checkout so it takes the remote path; point
          # the Git source at this checkout so the pull request's own code is installed.
          mkdir -p "$RUNNER_TEMP/remote" "$RUNNER_TEMP/home2"
          cp install.sh "$RUNNER_TEMP/remote/install.sh"
          cd "$RUNNER_TEMP/remote"
          # CI checks out a detached merge commit; pin it so the Git clone needs no default branch.
          GIG_REPO_URL="file://$GITHUB_WORKSPACE@$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            GIG_HOME="$RUNNER_TEMP/home2" bash install.sh --assistant gemini
          "$(uv tool dir --bin)/git-into-gsoc" --version
          test -f "$RUNNER_TEMP/home2/.agents/skills/git-into-gsoc/SKILL.md"

  smoke-windows:
    name: Installer smoke (Windows)
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: PowerShell installer (clone, project scope)
        shell: pwsh
        run: |
          .\install.ps1 -NoUserSkills -Assistant all
          .\.venv\Scripts\git-into-gsoc.exe --version
          if (-not (Test-Path ".claude\skills\git-into-gsoc\SKILL.md")) { throw "skill not installed" }
          if (-not (Test-Path ".cursor\mcp.json")) { throw "mcp not registered" }
          .\.venv\Scripts\git-into-gsoc.exe doctor

      # The route most Windows users take: `irm ... | iex` with uv or pipx, then a new
      # terminal. It must leave the command on PATH without any manual step.
      - name: PowerShell installer (one-line install, new terminal)
        shell: pwsh
        run: |
          $commit = git -C $env:GITHUB_WORKSPACE rev-parse HEAD
          $env:GIG_REPO_URL = "file:///" + ($env:GITHUB_WORKSPACE -replace '\\', '/') + "@$commit"
          $env:GIG_HOME = Join-Path $env:RUNNER_TEMP "home-oneline"
          $env:GIG_DATA_DIR = Join-Path $env:RUNNER_TEMP "gig-data"
          $env:GIG_CACHE_DIR = Join-Path $env:RUNNER_TEMP "gig-cache"
          $before = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          Get-Content -Raw .\install.ps1 | Invoke-Expression
          # A new terminal reads PATH from the registry, not from this session.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $found = (Get-Command git-into-gsoc -ErrorAction Stop).Source
          $folder = Split-Path $found
          Write-Host "git-into-gsoc found at $found (folder on PATH before install: $(@($before.Split(';')) -contains $folder))"
          git-into-gsoc --version
          if ($LASTEXITCODE) { throw "git-into-gsoc --version failed" }
          git-into-gsoc start --no-input --tech python --output json | Out-Null
          if ($LASTEXITCODE) { throw "git-into-gsoc start failed" }
