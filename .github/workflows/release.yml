name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job asks for the access it needs and nothing else.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # With the built-in token, GitHub holds CI and CodeQL on the release pull
          # request until someone closes and reopens it. A token from the owner,
          # stored as RELEASE_PLEASE_TOKEN, makes them start by themselves. Without
          # the secret this falls back to the built-in token (docs/releasing.md).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    name: Release assets and MCP registry
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # A release created with the built-in token does not fire the `release`
      # event, so start the workflow that attaches the wheel, the source archive
      # and the MCPB bundle to the release and publishes to the MCP registry.
      - name: Dispatch the release assets workflow for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run mcp-registry.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f tag="$TAG"

  publish:
    name: Publish to PyPI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    # Non-blocking for the release itself, but a failed upload shows as a failed job
    # (red) instead of hiding behind a green check.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      # Build from the tag, not from the commit that started this run. Release Please
      # creates the release on the first run that sees the merged release pull request,
      # and when that run fails (three did, with GraphQL errors) a later commit starts
      # it; PyPI never takes a version twice, so a wrong upload could not be replaced.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install -U pip build
          python -m build

      - name: Check that the built version matches the tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          ls -l dist
          test -f "dist/git_into_gsoc-${TAG#v}-py3-none-any.whl"
          test -f "dist/git_into_gsoc-${TAG#v}.tar.gz"

      - name: Publish (Trusted Publishing)
        id: pypi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Explain a failed upload
        if: failure() && steps.pypi.outcome == 'failure'
        run: |
          {
            echo "## PyPI upload failed"
            echo
            echo "The GitHub release and its assets are published; only the PyPI upload failed."
            echo "If the log says \`invalid-publisher\`, add a trusted publisher on pypi.org"
            echo "(Your account > Publishing > Add a pending publisher) with:"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| PyPI project name | git-into-gsoc |"
            echo "| Owner | ${GITHUB_REPOSITORY_OWNER} |"
            echo "| Repository | ${GITHUB_REPOSITORY#*/} |"
            echo "| Workflow | release.yml |"
            echo "| Environment | release |"
            echo
            echo "Then re-run this job. Details: docs/releasing.md."
          } >> "$GITHUB_STEP_SUMMARY"
