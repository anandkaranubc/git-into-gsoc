name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    name: Release assets and MCP registry
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # A release created with the built-in token does not fire the `release`
      # event, so start the workflow that attaches the wheel, the source archive
      # and the MCPB bundle to the release and publishes to the MCP registry.
      - name: Dispatch the release assets workflow for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mcp-registry.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f tag="${{ needs.release-please.outputs.tag_name }}"

  publish:
    name: Publish to PyPI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install -U pip build
          python -m build

      - name: Publish (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        # Optional until a PyPI trusted publisher is configured for this repo.
