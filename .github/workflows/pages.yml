name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "brand/**"
      - "scripts/build_site.py"
      - "scripts/build_docs.py"
      - "docs/**"
      - "src/git_into_gsoc/data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deployment cut off halfway can leave the site half updated; let it finish and
# queue the next one, as GitHub's own Pages workflow does.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One page per organization from the bundled snapshot; the output is not
      # committed, so every deploy rebuilds it. Standard library only: no install.
      - name: Build the organization explorer
        run: python3 scripts/build_site.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # docs/ rendered as site pages, so the guide is indexable; see scripts/build_docs.py.
      - name: Render the docs
        run: |
          python3 -m pip install --quiet ".[dev]"
          python3 scripts/build_docs.py

      # Pages builds from this workflow, so Jekyll never runs and no .nojekyll
      # file is needed (the upload step would leave dotfiles out anyway).
      - name: Stage site + brand assets
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r brand _site/brand

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
