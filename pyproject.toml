[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "git-into-gsoc"
version = "0.2.1"
description = "Find your first open-source contribution and prepare for Google Summer of Code: CLI, MCP server, and Agent Skill"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "git-into-gsoc contributors" },
]
keywords = [
  "gsoc",
  "google-summer-of-code",
  "open-source",
  "mcp",
  "agent-skills",
  "github",
  "contributor",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "mcp>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "rich>=13.7",
  "typer>=0.12",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/anandkaranubc/git-into-gsoc"
Documentation = "https://github.com/anandkaranubc/git-into-gsoc#readme"
Repository = "https://github.com/anandkaranubc/git-into-gsoc"
Issues = "https://github.com/anandkaranubc/git-into-gsoc/issues"
Changelog = "https://github.com/anandkaranubc/git-into-gsoc/blob/main/CHANGELOG.md"

[project.scripts]
git-into-gsoc = "git_into_gsoc.cli:app"
gsoc = "git_into_gsoc.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/git_into_gsoc"]

[tool.hatch.build.targets.wheel.sources]
"src/git_into_gsoc" = "git_into_gsoc"

# Ship the Agent Skill inside the wheel so `git-into-gsoc setup` works after
# `uv tool install` / `pipx install` with no checkout. Canonical copy: skills/.
[tool.hatch.build.targets.wheel.force-include]
"skills/git-into-gsoc" = "git_into_gsoc/skill"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/skills",
  "/tests",
  "/docs",
  "/examples",
  "/install.sh",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["git_into_gsoc"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
