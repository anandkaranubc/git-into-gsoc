[build-system]
requires = ["hatchling>=1.25", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "git-into-gsoc"
version = "0.23.0"
description = "Find your first open-source contribution and prepare for Google Summer of Code: CLI, MCP server, and Agent Skill"
# README.md, with its links rewritten for PyPI (see fancy-pypi-readme below).
dynamic = ["readme"]
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "git-into-gsoc contributors" },
]
keywords = [
  "gsoc",
  "google-summer-of-code",
  "open-source",
  "mcp",
  "agent-skills",
  "github",
  "contributor",
  "good-first-issue",
  "beginners",
]
# No license classifier: `license` above is the license expression PyPI shows.
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Topic :: Software Development",
  "Typing :: Typed",
]
# Upper bounds on majors that would break a fresh install, and on platformdirs, whose
# majors have moved default folders (that would hide a saved progress.json).
# Raise a bound in its own pull request once CI passes on the new major.
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=2.0,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "rich>=13.7",
  "typer>=0.12,<1",
  "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "jsonschema>=4.20",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://anandkaranubc.github.io/git-into-gsoc/"
Documentation = "https://github.com/anandkaranubc/git-into-gsoc/blob/main/docs/README.md"
Repository = "https://github.com/anandkaranubc/git-into-gsoc"
Issues = "https://github.com/anandkaranubc/git-into-gsoc/issues"
Changelog = "https://github.com/anandkaranubc/git-into-gsoc/blob/main/CHANGELOG.md"

[project.scripts]
git-into-gsoc = "git_into_gsoc.cli:app"
gsoc = "git_into_gsoc.cli:app"

# PyPI shows README.md on its own, so paths relative to the repository break there.
# Point images at the raw files and links at GitHub. The README itself keeps relative
# paths, which work on GitHub and in a checkout. tests/unit/test_pypi_readme.py
# checks that nothing relative is left.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/anandkaranubc/git-into-gsoc/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#|mailto:)([^"]+)"'
replacement = 'href="https://github.com/anandkaranubc/git-into-gsoc/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/anandkaranubc/git-into-gsoc/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?<!!)\[([^\]]*)\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '[\1](https://github.com/anandkaranubc/git-into-gsoc/blob/main/\2)'

[tool.hatch.build.targets.wheel]
packages = ["src/git_into_gsoc"]

[tool.hatch.build.targets.wheel.sources]
"src/git_into_gsoc" = "git_into_gsoc"

# Ship the Agent Skill inside the wheel so `git-into-gsoc setup` works after
# `uv tool install` / `pipx install` with no checkout. Canonical copy: skills/.
[tool.hatch.build.targets.wheel.force-include]
"skills/git-into-gsoc" = "git_into_gsoc/skill"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/skills",
  "/tests",
  "/evals",
  "/scripts/eval_matching.py",
  "/docs",
  "/examples",
  "/install.sh",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["git_into_gsoc"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
