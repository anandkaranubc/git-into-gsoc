# Runs the same formatter, linter, and type checker as CI before each commit.
# One-time setup after `pip install -e ".[dev]"`:  pre-commit install
# Run on everything:                                pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  # Ruff and mypy come from the project's own virtual environment, so the
  # versions and dependencies always match what CI and pyproject.toml use.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff (format)
        entry: ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: mypy src
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|pyproject\.toml)$
